name: lua-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lua-editor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true

      - name: Install test dependencies
        run: |
          luarocks install luafilesystem
          luarocks install lpeg
          luarocks install luv

      - name: Regenerate installer index
        run: |
          npm run generate:index
          git diff --exit-code -- nvim.idx

      - name: Run lua_editor suite
        run: npm test
